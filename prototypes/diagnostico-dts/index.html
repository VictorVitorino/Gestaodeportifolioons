  /* ------------------------------------------------------------ página 03 · mesa com fichas */
  function tokenAria(node, flipped, where, anchorLabel) {
    const info = SEMANTIC_GRAPH.nodes[node];
    if (!flipped) return 'Peça virada para baixo. Pressione para virar.';
    if (where === 'trail') return `${info.label}: ${info.short}`;
    return `${info.label}: ${info.short} Pressione para colocar perto de ${anchorLabel}.`;
  }
  function tokenHTML(node, { flipped, origin, where }) {
    const info = SEMANTIC_GRAPH.nodes[node];
    const inTrail = where === 'trail';
    return `<button type="button" class="token${flipped ? ' is-flipped' : ''}${origin ? ' is-origin' : ''}" data-node="${node}" ${inTrail ? 'tabindex="-1" aria-disabled="true"' : ''}
      aria-label="${esc(tokenAria(node, flipped, where, 'PROMPT'))}"><span class="token-inner">
      <span class="token-back" aria-hidden="true"><span class="tb-q">?</span><span class="tb-hint">virar</span></span>
      <span class="token-face" aria-hidden="true"><span class="tf-name">${esc(nodeUpper(node))}</span><span class="tf-desc">${esc(info.short)}</span></span></span></button>`;
  }

  const XP03 = {
    emptySlot: i => `<span class="slot-empty">${i === 1 ? 'a mais perto de PROMPT' : 'a mais perto da anterior'}</span>`,
    askHTML() {
      const e3 = state.experience03;
      if (e3.path.length === 0) return 'Qual peça você colocaria mais perto de <b>PROMPT</b>?';
      if (e3.path.length === 1) return `Agora <b>${esc(nodeUpper(e3.path[0]))}</b> virou sua nova referência. Qual você colocaria mais perto dela?`;
      const chain = e3.semanticPath.map(n => `<b>${esc(nodeUpper(n))}</b>`).join(' <span aria-hidden="true">→</span> ');
      return `Foi assim que você conectou as ideias: <span class="path-chain">${chain}</span>`;
    },
    html() {
      ensureUiState();
      const e3 = state.experience03;
      const flipped = new Set(state.meta.ui.flipped);
      const slots = [0, 1, 2].map(i => {
        const node = i === 0 ? e3.anchor : e3.path[i - 1];
        const cap = i === 0 ? 'peça de partida' : `${i}ª conexão`;
        const inner = node ? tokenHTML(node, { flipped: true, origin: i === 0, where: 'trail' }) : XP03.emptySlot(i);
        return `<div class="slot" data-slot="${i}"><span class="slot-cap">${cap}</span><div class="slot-well">${inner}</div></div>`;
      }).join('');
      const pool = state.meta.ui.poolOrder.map(node => `<div class="pool-cell" data-cell="${node}">${e3.path.includes(node)
        ? '<span class="pool-ghost" aria-hidden="true">na trilha</span>' : tokenHTML(node, { flipped: flipped.has(node), where: 'pool' })}</div>`).join('');
      return `<section class="sheet xp xp03"><span class="tape tape-l" aria-hidden="true"></span>
        ${headerHTML({ n: 3, title: 'Quem está <span class="hl">mais perto?</span>', sub: 'A primeira peça é PROMPT. Depois de conhecer as outras, escolha aquela que você colocaria mais perto dele.',
          aside: '<p class="postit analogy"><b>Lembra do Lince?</b>No Lince, seus olhos procuravam a figura que mais combinava com a pista. Aqui vamos fazer algo parecido com conceitos.</p>' })}
        <div class="table-surface dark-surface">
          <div class="trail" data-trail><svg class="trail-lines" aria-hidden="true"></svg>${slots}</div>
          <div class="table-row"><p class="table-ask" data-ask aria-live="polite">${XP03.askHTML()}</p>
            <div class="table-tools"><button type="button" class="btn-chalk" data-action="flip-all">Virar todas as peças</button><button type="button" class="btn-chalk" data-action="reset-links" ${e3.path.length ? '' : 'hidden'}>Refazer conexões</button></div></div>
          <div class="pool" data-pool role="group" aria-label="Peças sobre a mesa">${pool}</div>
        </div>
        ${footerHTML({ back: 2, enabled: e3.path.length >= CONFIG.experience03Connections,
          note: e3.path.length >= CONFIG.experience03Connections ? 'Conexões registradas.' : 'Vire as fichas como no Cara a Cara: você pode virar todas antes de decidir. Toque de novo para levar uma à trilha.' })}
      </section>`;
    },
    mount(rootEl) {
      const e3 = state.experience03;
      const trail = $('[data-trail]', rootEl);
      const svg = $('.trail-lines', trail);
      const ask = $('[data-ask]', rootEl);
      let busy = false;
      const isComplete = () => e3.path.length >= CONFIG.experience03Connections;
      const anchorNode = () => (e3.path.length ? e3.path[e3.path.length - 1] : e3.anchor);

      const refresh = () => {
        const flipped = new Set(state.meta.ui.flipped);
        const complete = isComplete();
        $$('.pool .token', rootEl).forEach(token => {
          const node = token.dataset.node;
          const isUp = flipped.has(node);
          token.classList.toggle('is-flipped', isUp);
          token.setAttribute('aria-label', tokenAria(node, isUp, 'pool', nodeUpper(anchorNode())));
          token.setAttribute('aria-disabled', String(isUp && complete));
        });
        $$('.trail .token', rootEl).forEach(token => token.classList.toggle('is-anchor', !complete && token.dataset.node === anchorNode()));
        $('[data-action="reset-links"]', rootEl).hidden = e3.path.length === 0;
        setNextEnabled(rootEl, complete);
      };

      const drawLines = animateIndex => {
        const box = trail.getBoundingClientRect();
        svg.setAttribute('viewBox', `0 0 ${Math.max(1, box.width)} ${Math.max(1, box.height)}`);
        svg.innerHTML = '';
        const jobs = [];
        for (let i = 1; i <= e3.path.length; i++) {
          const a = $(`[data-slot="${i - 1}"] .token`, trail);
          const b = $(`[data-slot="${i}"] .token`, trail);
          if (!a || !b) continue;
          const ra = a.getBoundingClientRect();
          const rb = b.getBoundingClientRect();
          const x1 = ra.right - box.left + 4;
          const y1 = ra.top + ra.height / 2 - box.top;
          const x2 = rb.left - box.left - 6;
          const y2 = rb.top + rb.height / 2 - box.top;
          const dx = x2 - x1;
          const line = svgPath(`M${x1},${y1} C${x1 + dx * 0.35},${y1 - 18} ${x1 + dx * 0.65},${y2 + 18} ${x2},${y2}`);
          const head = svgPath(`M${x2 - 9},${y2 - 6} L${x2},${y2} L${x2 - 9},${y2 + 6}`);
          svg.append(line, head);
          if (i === animateIndex) {
            head.style.opacity = '0';
            jobs.push(drawStroke(line, { duration: 650 }).then(() => { head.style.opacity = '1'; }));
          }
        }
        return Promise.all(jobs);
      };

      const flip = (token, quiet) => {
        const node = token.dataset.node;
        if (!state.meta.ui.flipped.includes(node)) state.meta.ui.flipped.push(node);
        Store.save(state);
        refresh();
        if (!quiet) setFootNote(rootEl, `${nodeLabel(node)}: ${SEMANTIC_GRAPH.nodes[node].short}`, false);
      };

      const focusNext = () => {
        const target = isComplete() ? $('[data-next]', rootEl) : $('.pool .token', rootEl);
        if (target) target.focus({ preventScroll: true });
      };

      const connect = token => {
        if (busy) return;
        busy = true;
        const node = token.dataset.node;
        const cell = token.parentElement;
        e3.path.push(node);
        commit();
        const well = $(`[data-slot="${e3.path.length}"] .slot-well`, trail);
        const empty = $('.slot-empty', well);
        if (empty) empty.remove();
        cell.insertAdjacentHTML('beforeend', '<span class="pool-ghost" aria-hidden="true">na trilha</span>');
        token.tabIndex = -1;
        token.setAttribute('aria-disabled', 'true');
        token.setAttribute('aria-label', tokenAria(node, true, 'trail'));
        ask.textContent = 'Conexão registrada.';
        refresh();
        flipMove(token, well).then(() => drawLines(e3.path.length)).then(() => {
          setFootNote(rootEl, e3.path.length === 1 ? 'Conexão registrada. A peça escolhida agora é o novo ponto de referência.' : 'Conexão registrada. Vamos levar isso para o seu mapa de nivelamento.', true);
          setTimeout(() => { ask.innerHTML = XP03.askHTML(); }, 650);
          busy = false;
          focusNext();
        });
      };

      const resetLinks = () => {
        if (busy || !e3.path.length) return;
        busy = true;
        const nodes = e3.path.slice();
        e3.path = [];
        commit();
        svg.innerHTML = '';
        const moves = nodes.map(node => {
          const token = $(`.trail .token[data-node="${node}"]`, rootEl);
          const cell = $(`.pool-cell[data-cell="${node}"]`, rootEl);
          const ghost = $('.pool-ghost', cell);
          if (ghost) ghost.remove();
          token.removeAttribute('tabindex');
          token.classList.remove('is-anchor');
          return flipMove(token, cell);
        });
        [1, 2].forEach(i => {
          const well = $(`[data-slot="${i}"] .slot-well`, trail);
          if (!$('.token', well)) well.insertAdjacentHTML('beforeend', XP03.emptySlot(i));
        });
        ask.innerHTML = XP03.askHTML();
        refresh();
        setFootNote(rootEl, 'Mesa arrumada. Monte a conexão de novo.', false);
        Promise.all(moves).then(() => { busy = false; });
      };

      $('[data-pool]', rootEl).addEventListener('click', event => {
        const token = event.target.closest('.token');
        if (!token || busy) return;
        if (!token.classList.contains('is-flipped')) { flip(token, false); return; }
        if (isComplete()) {
          token.classList.remove('nudge'); void token.offsetWidth; token.classList.add('nudge');
          setFootNote(rootEl, 'Suas duas conexões já estão registradas. Para mudar, use “Refazer conexões”.', false);
          return;
        }
        connect(token);
      });
      $('[data-action="flip-all"]', rootEl).addEventListener('click', () => {
        const hidden = $$('.pool .token:not(.is-flipped)', rootEl);
        hidden.forEach((token, i) => setTimeout(() => flip(token, true), motionOK() ? i * 90 : 0));
        setFootNote(rootEl, isComplete() ? 'Todas as peças à vista.' : `Todas à vista. Agora escolha a mais perto de ${nodeUpper(anchorNode())}.`, false);
      });
      $('[data-action="reset-links"]', rootEl).addEventListener('click', resetLinks);

      const relayout = () => { if (!busy) drawLines(0); };
      const observer = new ResizeObserver(relayout);
      observer.observe(trail);
      onCleanup(() => observer.disconnect());
      rootEl.addEventListener('settled', relayout);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
      refresh();
      requestAnimationFrame(relayout);
    }
  };

        if (getComputedStyle(svg).display === 'none') return;

          const y = r.top + r.height / 2 - box.top;
          const pin = svgPath(curve(s.right - box.left, s.top + s.height / 2 - box.top, r.left - box.left, y), on ? 'is-on' : '');
          const pout = svgPath(curve(r.right - box.left, y, t.left - box.left, t.top + t.height / 2 - box.top), on ? 'is-on' : '');
          svg.append(pin, pout);
          if (on && animate) { drawStroke(pin, { duration: 420 }); drawStroke(pout, { duration: 420, delay: 820 }); }
        });
      };
      bindRadioGroup($('.routes', rootEl), radio => {
        e4.selectedPath = radio.dataset.route;
        commit();
        draw(true);
        setNextEnabled(rootEl, true);
        setFootNote(rootEl, 'Esse caminho mostra como você tende a começar uma demanda hoje.', true);
      });
      const observer = new ResizeObserver(() => draw(false));
      observer.observe(board);
      onCleanup(() => observer.disconnect());
      rootEl.addEventListener('settled', () => draw(false));
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw(false));
      requestAnimationFrame(() => draw(false));
    }
  };

  function bindMultiPick(rootEl, { selector, list, max, onChange }) {
    const buttons = $$(selector, rootEl);
    const sync = () => {
      const full = list.length >= max;
      buttons.forEach(btn => {
        const on = list.includes(btn.dataset.el);
        btn.setAttribute('aria-pressed', String(on));
        if (!on && full) btn.setAttribute('aria-disabled', 'true'); else btn.removeAttribute('aria-disabled');
      });
      onChange(false);
    };
    buttons.forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.el;
      const index = list.indexOf(id);
      if (index >= 0) list.splice(index, 1);
      else if (list.length >= max) { setFootNote(rootEl, `Você já escolheu ${max}. Tire uma para trocar.`, false); return; }
      else list.push(id);
      commit();
      sync();
      onChange(true, index < 0);
    }));
    sync();
  }

      ['Faixa declarada', stage],
      ['E02 · percepção da situação · 15%', fmt(s.experience02.score)],
      ['E03 · proximidade semântica · 20%', fmt(s.experience03.score)],
      ['E04 · fluxo de decisão · 20%', fmt(s.experience04.score)],
      ['E05 · estrutura de Skill · 15%', fmt(s.experience05.score)],
      ['E06 · Prompt / Contexto · 15%', fmt(s.experience06.score)],
      ['E07 · construção de Prompt · 15%', fmt(s.experience07.score)],
      ['demonstratedIndex', fmt(r.demonstratedIndex)],
      ['overallMaturityIndex (30/70)', fmt(r.overallMaturityIndex)],
      ['alignmentGap', fmt(r.alignmentGap)],
      ['alignmentIndex', fmt(r.alignmentIndex)]
    ];
    const profile = r.dimensionProfile || { declared: {}, demonstrated: {} };
    const dims = Object.keys(Core.DIMENSIONS).map(k => `<tr><td>${esc(Core.DIMENSIONS[k])}</td><td>${fmt(profile.declared[k])}</td><td>${fmt(profile.demonstrated[k])}</td></tr>`).join('');
    facEl.innerHTML = `<h2>Painel interno · facilitação</h2>
      <p>Visível só com <b>#facilitador</b> no endereço. Não mostrar ao participante.</p>
      <table><tbody>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
      <h3>Perfil por dimensão</h3>
      <table><thead><tr><th>Dimensão</th><th>Declarado</th><th>Demonstrado</th></tr></thead><tbody>${dims}</tbody></table>
      <h3>Sinais de comportamento</h3>
      <table><tbody>
        <tr><td>semanticPath</td><td>${esc(s.experience03.semanticPath.join(' → '))}</td></tr>
        <tr><td>distâncias no grafo</td><td>${esc(s.experience03.semanticDistances.join(' · ') || '—')}</td></tr>
        <tr><td>behaviorProfile</td><td>${esc(s.experience04.behaviorProfile || '—')}</td></tr>
        <tr><td>rascunho 1 · estrutura</td><td>${fmt(s.experience07.originalStructureScore)}</td></tr>
        <tr><td>rascunho 2 · estrutura</td><td>${fmt(s.experience07.revisedStructureScore)}</td></tr>
        <tr><td>learningDelta</td><td>${fmt(s.experience07.learningDelta)}</td></tr>
      </tbody></table>
      <div class="fac-actions"><button type="button" data-fac="copy">Copiar JSON</button><button type="button" data-fac="close">Fechar painel</button></div>
      <pre data-fac-json>${esc(JSON.stringify(s, null, 2))}</pre>`;
  }
  facEl.addEventListener('click', event => {
    const btn = event.target.closest('[data-fac]');
    if (!btn) return;
    if (btn.dataset.fac === 'close') {
      try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) { window.location.hash = ''; }
      refreshFacilitator();
      return;
    }
    const json = JSON.stringify(state, null, 2);
    const fallback = () => { const pre = $('[data-fac-json]', facEl); const range = document.createRange(); range.selectNodeContents(pre); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); btn.textContent = 'Selecionado: use Ctrl+C'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(() => { btn.textContent = 'JSON copiado'; }, fallback);
    else fallback();
  });
  window.addEventListener('hashchange', refreshFacilitator);

  /* ------------------------------------------------------------ recomeçar (confirmação na própria página) */
  const modal = $('#confirmModal');
  let lastFocus = null;
  function openConfirm() {
    lastFocus = document.activeElement;
    modal.hidden = false;
    $('[data-modal="cancel"]', modal).focus();
  }
  function closeConfirm() {
    modal.hidden = true;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  modal.addEventListener('click', event => {
    if (event.target === modal) { closeConfirm(); return; }
    const btn = event.target.closest('[data-modal]');
    if (!btn) return;
    if (btn.dataset.modal === 'cancel') { closeConfirm(); return; }
    Store.clear();
    state = Core.createInitialState();
    ensureUiState();
    commit();
    modal.hidden = true;
    renderStage({ direction: 'back', focus: true });
  });
  modal.addEventListener('keydown', event => {
    if (event.key === 'Escape') { closeConfirm(); return; }
    if (event.key !== 'Tab') return;
    const buttons = $$('button', modal);
    const first = buttons[0];
    const last = buttons[buttons.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  $('#restartBtn').addEventListener('click', openConfirm);

  /* ------------------------------------------------------------ navegação global */
  document.addEventListener('click', event => {
    const goto = event.target.closest('[data-goto]');
    if (goto && !goto.disabled) { goTo(Number(goto.dataset.goto)); return; }
    const restart = event.target.closest('[data-action="restart"]');
    if (restart) { openConfirm(); return; }
    const next = event.target.closest('[data-action="next"]');
    if (next && !next.disabled) goTo(state.meta.currentPage + 1, { direction: 'forward' });
  });

  /* ------------------------------------------------------------ boot */
  function start(hotData) {
    const saved = (hotData && hotData.state) || Store.load();
    state = deepMerge(Core.createInitialState(), saved);
    ensureUiState();
    sanitizeState();
    commit();
    renderStage({ direction: 'none' });
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ state }));
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});

  // Acesso para inspeção no console (não usado pela interface).
  window.DTSAssessment = { get state() { return state; }, recompute: () => { commit(); return state.results; } };
})();
</script>
</body>
</html>
